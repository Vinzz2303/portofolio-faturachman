<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a7122" />
      <stop offset="20%" stop-color="#dfb45b" />
      <stop offset="48%" stop-color="#fff5b8" />
      <stop offset="75%" stop-color="#cba03f" />
      <stop offset="100%" stop-color="#8f641b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5" />

  <!-- Inner Soft Bevel -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Faturachman Golden Emblem -->
  <g filter="url(#goldGlow)">
    <!-- Top Trapezoid Bar -->
    <path d="M 16 33 L 84 33 L 71 51 L 29 51 Z" fill="url(#goldGrad)" />
    <!-- Bottom Diamond / Inverted Triangle -->
    <path d="M 39 58 L 61 58 L 50 71 Z" fill="url(#goldGrad)" />
  </g>
</svg>
